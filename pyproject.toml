[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ai-knowledge-assistant-portfolio"
version = "0.1.0"
description = "Sanitized AWS AI Knowledge Assistant reference implementation"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

